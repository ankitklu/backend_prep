<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3 style="color: red; font-size: 20px; text-align: center;">
        5,999
    </h3>
    <span>INR</span>
    <script>
  // Paste your detectAndLogCurrency and helper functions here (same as your code above)
  const getAmount = (str, regex) => {
    const match = str.match(regex);
    if (match) {
      return Number(match[1]);
    }
    return null;
  };

  const setCookie = (name, value, minutesToExpire) => {
    if (
      typeof document === "undefined" ||
      typeof document.cookie === "undefined"
    ) {
      return;
    }
    const date = new Date();
    date.setTime(date.getTime() + minutesToExpire * 60 * 1000);
    const expires = "expires=" + date.toUTCString();
    document.cookie = name + "=" + value + ";" + expires + ";path=/";
  };

  const getCookie = (name) => {
    if (
      typeof document === "undefined" ||
      typeof document.cookie === "undefined"
    ) {
      return null;
    }
    const cookieName = name + "=";
    const cookies = document.cookie.split(";");
    for (let i = 0; i < cookies.length; i++) {
      let cookie = cookies[i].trim();
      if (cookie.indexOf(cookieName) === 0) {
        return cookie.substring(cookieName.length, cookie.length);
      }
    }
    return null;
  };

  async function detectAndLogCurrency(defaultCurrency = "INR", defaultAmount = 4100) {
    try {
      const cookieCurrency = getCookie("currency");
      const cookieAmount = getCookie("amount");

      if (cookieCurrency && cookieAmount) {
        console.log(`Using cookie data - Currency: ${cookieCurrency}, Amount: ${cookieAmount}`);
        return { currency: cookieCurrency, amount: Number(cookieAmount) };
      }

      const fetchFn =
        typeof fetch !== "undefined"
          ? fetch
          : (...args) =>
              import("node-fetch").then(({ default: f }) => f(...args));

      const docRes = await fetchFn(
        "https://learnyard.tagmango.ai/web/checkout/67d5266b4bbcba673b8818d1"
      );
      const html = await docRes.text();

      const usdAmount = getAmount(html, /usdAmount\\":\s*(\d+)/);
      const eurAmount = getAmount(html, /eurAmount\\":\s*(\d+)/);
      const inrAmount = getAmount(html, /inrAmount\\":\s*(\d+)/);

      let country = getCookie("user_country");

      if (!country) {
        const countryRes = await fetchFn(
          "https://api-prod-new.tagmango.com/get-country-through-ip"
        );
        const data = await countryRes.json();
        const result = JSON.parse(data.result);
        country = "Germany";
        setCookie("user_country", country, 24 * 60);
      } else {
        console.log(`Using country from cookie: ${country}`);
      }

      let currency, amount;
      if (usdAmount != null && country === "United States") {
        currency = "USD";
        amount = usdAmount;
      } else if (inrAmount != null && country === "India") {
        currency = "INR";
        amount = inrAmount;
      } else if (
        eurAmount != null &&
        [
          "Germany",
          "France",
          "Spain",
          "Italy",
          "Netherlands",
          "Belgium",
          "Austria",
          "Finland",
          "Ireland",
          "Portugal",
          "Greece",
          "Slovakia",
          "Slovenia",
          "Estonia",
          "Latvia",
          "Lithuania",
          "Luxembourg",
          "Malta",
          "Cyprus",
        ].includes(country)
      ) {
        currency = "EUR";
        amount = eurAmount;
      } else {
        currency = defaultCurrency;
        amount = defaultAmount;
      }

      setCookie("currency", currency, 10);
      setCookie("amount", amount, 10);

      console.log(`Currency: ${currency}, Amount: ${amount}`);
      return { currency, amount };
    } catch (e) {
      console.error("Error:", e.message);
      console.log(`Currency: ${defaultCurrency}, Amount: ${defaultAmount}`);
      return { currency: defaultCurrency, amount: defaultAmount };
    }
  }

  // 👇 Run on page load to update DOM
  detectAndLogCurrency().then(({ currency, amount }) => {
    const priceEl = document.querySelector("h3");
    const currencyEl = document.querySelector("span");

    if (priceEl) priceEl.innerText = amount.toLocaleString(); // format like 9,999
    if (currencyEl) currencyEl.innerText = currency;
  });
</script>

</body>
</html>
