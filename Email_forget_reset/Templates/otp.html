<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Email Template</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            background-color: #4CAF50;
            padding: 10px 0;
            text-align: center;
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }
        .otp-message {
            font-size: 18px;
            color: #333333;
            text-align: center;
            margin: 20px 0;
        }
        .otp-code {
            font-size: 28px;
            font-weight: bold;
            color: #4CAF50;
            background-color: #f9f9f9;
            padding: 10px;
            letter-spacing: 3px;
            border-radius: 8px;
            display: inline-block;
            margin: 10px 0;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #888888;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Your OTP Code</div>
        <div class="otp-message">
            Hello #{name} Please use the following OTP to complete your transaction. The OTP is valid for 10 minutes.
        </div>
        <div class="otp-code">
            #{otp}
        </div>
        <div class="footer">
            If you did not request this code, please ignore this email.
        </div>
    </div>
</body>
</html>
